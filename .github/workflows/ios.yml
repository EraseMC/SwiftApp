name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Generate project
        run: scripts/ci/xcodegen.sh

      - name: Test EraseKit
        run: swift test --package-path Packages/EraseKit

      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project Erase.xcodeproj \
            -scheme Erase \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Erase.app out/Payload/
          cd out && zip -qry "Erase-${GITHUB_SHA::7}.ipa" Payload

      - uses: actions/upload-artifact@v7
        with:
          name: Erase-ipa
          path: out/*.ipa
          retention-days: 30

      # A fixed release that always holds the newest build, so Sideloadly gets a direct link.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.ipa out/Erase.ipa
          notes="Build of ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/Erase.ipa --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest out/Erase.ipa --title "Latest build" --notes "$notes" --prerelease
          fi
          git tag -f latest && git push -f origin refs/tags/latest

  screenshots:
    name: Simulator screenshots
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: scripts/ci/xcodegen.sh

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Erase.xcodeproj \
            -scheme Erase \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            | xcbeautify --renderer github-actions

      - name: Take screenshots
        run: scripts/ci/screenshots.sh build/Build/Products/Debug-iphonesimulator/Erase.app shots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 14

  ios18:
    name: iOS 18 screenshots
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate project
        run: scripts/ci/xcodegen.sh

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build             -project Erase.xcodeproj             -scheme Erase             -configuration Debug             -destination 'generic/platform=iOS Simulator'             -derivedDataPath build             | xcbeautify --renderer github-actions

      - name: Take screenshots on iOS 18
        run: scripts/ci/screenshots.sh build/Build/Products/Debug-iphonesimulator/Erase.app shots 18

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-ios18
          path: shots
          retention-days: 14
