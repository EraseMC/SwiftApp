name: Erase

options:
  bundleIdPrefix: com.erasemc
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  EraseKit:
    path: Packages/EraseKit
  EraseUI:
    path: Packages/EraseUI

targets:
  Erase:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: EraseKit
      - package: EraseUI
      - target: EraseWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Erase
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.erasemc.app
            CFBundleURLSchemes:
              - erasemc
        LSApplicationQueriesSchemes:
          - minecraft
        CFBundleLocalizations:
          - en
          - ru
        CFBundleDevelopmentRegion: en
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Confirms staff actions such as bans and rank changes.
        NSUserActivityTypes:
          - com.erasemc.app.player
        UIAppFonts:
          - Geologica-Medium.ttf
          - Geologica-SemiBold.ttf
          - Geologica-Bold.ttf
          - Onest-Regular.ttf
          - Onest-Medium.ttf
          - Onest-SemiBold.ttf
          - Onest-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erasemc.app
        PRODUCT_NAME: Erase
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Midnight AppIcon-Lime
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  EraseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    dependencies:
      - package: EraseKit
      - package: EraseUI
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Erase
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erasemc.app.widgets
        PRODUCT_NAME: EraseWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  Erase:
    build:
      targets:
        Erase: all
    run:
      config: Debug
    archive:
      config: Release
